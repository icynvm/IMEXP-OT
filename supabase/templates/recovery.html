<h2>ตั้งรหัสผ่านใหม่ — ระบบขอ OT</h2>
<p>มีการขอตั้งรหัสผ่านใหม่สำหรับบัญชีของคุณ กดปุ่มด้านล่างเพื่อตั้งรหัสผ่านใหม่</p>
<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/auth/reset-password"
     style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px">
    ตั้งรหัสผ่านใหม่
  </a>
</p>
<p style="color:#6b7280;font-size:12px">หากคุณไม่ได้เป็นผู้ขอ สามารถเพิกเฉยต่ออีเมลนี้ได้ รหัสผ่านเดิมยังใช้งานได้ตามปกติ</p>
